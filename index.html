<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verses</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    background-color: #000000;
    color: #f2f2f2;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Georgia', 'Times New Roman', serif;
    padding: 2rem;
  }

  .verses {
    text-align: center;
    max-width: 600px;
    line-height: 1.9;
    font-size: 1.25rem;
    font-weight: 300;
    letter-spacing: 0.02em;
    white-space: pre-line;
  }
</style>
</head>
<body>

  <div class="verses">Replace this line with your first verse
Replace this line with the next line
Keep going, line by line

Leave a blank line between verses
Like this second verse here
And this last line</div>

</body>
</html>
